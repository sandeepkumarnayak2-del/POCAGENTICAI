services:

  # ============================================================
  # FASTAPI / AI AGENT API
  # ============================================================

  - type: web
    name: enterprise-ai-agent-api-v2
    runtime: docker
    plan: free
    region: frankfurt

    dockerfilePath: ./Dockerfile
    dockerContext: .

    healthCheckPath: /health
    autoDeployTrigger: checksPass

    envVars:

      - key: APP_NAME
        value: Enterprise AI Service Desk

      - key: ENVIRONMENT
        value: production

      - key: SECRET_KEY
        generateValue: true

      # -------------------------
      # PostgreSQL V2
      # -------------------------

      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-ai-agent-db-v2
          property: connectionString

      # -------------------------
      # EXISTING Redis / Key Value
      # -------------------------

      - key: REDIS_URL
        fromService:
          name: enterprise-ai-agent-cache
          type: keyvalue
          property: connectionString

      - key: RATE_LIMIT_STORAGE_URI
        fromService:
          name: enterprise-ai-agent-cache
          type: keyvalue
          property: connectionString

      # -------------------------
      # RAG
      # -------------------------

      - key: CHROMA_PATH
        value: /tmp/chroma

      # -------------------------
      # LLM
      # -------------------------

      - key: LLM_PROVIDER
        value: groq

      - key: GROQ_API_KEY
        sync: false

      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

      # -------------------------
      # MCP
      # -------------------------

      - key: MCP_ENABLED
        value: "true"

      - key: MCP_SERVER_URL
        value: https://enterprise-ai-agent-mcp-v2.onrender.com/mcp

      # -------------------------
      # Application
      # -------------------------

      - key: MAX_MESSAGE_LENGTH
        value: "1000"

      - key: RATE_LIMIT_PER_MINUTE
        value: "20"

      - key: CORS_ORIGINS
        value: "*"

      - key: LOG_LEVEL
        value: INFO


  # ============================================================
  # MCP SERVER V2
  # ============================================================

  - type: web
    name: enterprise-ai-agent-mcp-v2
    runtime: docker
    plan: free
    region: frankfurt

    dockerfilePath: ./Dockerfile
    dockerContext: .

    dockerCommand: python -m app.mcp.server

    autoDeployTrigger: checksPass

    envVars:

      - key: APP_NAME
        value: Enterprise AI Service Desk

      - key: ENVIRONMENT
        value: production

      # -------------------------
      # MCP
      # -------------------------

      - key: MCP_ENABLED
        value: "true"

      - key: MCP_TRANSPORT
        value: streamable-http

      - key: MCP_HOST
        value: 0.0.0.0

      # -------------------------
      # PostgreSQL V2
      # -------------------------

      - key: DATABASE_URL
        fromDatabase:
          name: enterprise-ai-agent-db-v2
          property: connectionString

      - key: LOG_LEVEL
        value: INFO


# ============================================================
# NEW POSTGRESQL V2
# ============================================================

databases:

  - name: enterprise-ai-agent-db-v2
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"